name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-qa:
    name: Backend Lint & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Python syntax & import check
        run: |
          python -m compileall backend/app backend/scripts

      - name: Run RBAC and security test suites
        env:
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "dummy_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "dummy_service_role_key"
          AWM_MANAGER_EMAILS: "manager@awm.gov,tryashas076@gmail.com"
          AWM_STAFF_EMAILS: "staff@awm.gov"
        run: |
          cd backend
          python test_three_role_login.py
          python test_portal_combinations.py

  frontend-qa:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend application
        working-directory: frontend
        run: npm run build
